[project]
name = "frameripper"
version = "0.1.0"
description = "Browse video frames and export the best stills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.7",
    "av>=14.0",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.scripts]
frameripper = "frameripper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frameripper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
